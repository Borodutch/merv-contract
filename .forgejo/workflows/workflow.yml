name: Build and lint code
on:
  pull_request:
    types: [synchronize, opened]
env:
  NODE_ENV: test
  # Compiling only: hardhat.config.ts requires these, nothing connects to them
  ETH_RPC: https://example.com/rpc
  ETH_RPC_MAINNET: https://example.com/rpc
jobs:
  build-and-lint-code:
    runs-on: ubuntu-latest
    steps:
      - uses: Borodutch/build-and-lint-code@v1.0.3
